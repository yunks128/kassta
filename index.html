    <!--
      The site used HashRouter until Aug 2026, so links shared before then look like
      https://kassta.ksea.org/#/activities. Rewrite those to real paths before React
      mounts so old links, bookmarks, and newsletter URLs keep working.
    -->
    <script>
      (function () {
        var h = window.location.hash
        if (h.indexOf('#/') === 0) {
          var rest = h.slice(1)
          // "#/activities#signatureforum2026" -> path "/activities", anchor "#signatureforum2026"
          var cut = rest.indexOf('#', 1)
          var path = cut === -1 ? rest : rest.slice(0, cut)
          var anchor = cut === -1 ? '' : rest.slice(cut)
          window.history.replaceState(null, '', path + window.location.search + anchor)
        }
      })()
    </script>
